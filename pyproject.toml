[project]
name = "price-tracker"
version = "1.0.0"
description = "Collects Deribit index prices on a schedule and serves them through a FastAPI read API."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14,<4",
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<1",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.143,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
    "yarl>=1.18,<2",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32",
    "celery-types>=0.26",
    "httpx2>=2.13",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_tracker"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D1",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "PLR2004",
    "S101",
]
"migrations/**" = [
    "D",
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.lint.isort]
known-first-party = ["price_tracker"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["integration: requires a running PostgreSQL"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["price_tracker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
